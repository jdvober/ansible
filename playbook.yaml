---
- name: System Setup Post-Install
  # specify what hosts this should run on.  See inventory.yaml for hosts
  hosts: this-local-machine
  become: yes
  vars_files:
    - packages.yaml
  vars:
    ###########################################################################
    # Playbook-wide variables
    ###########################################################################
    username: jdv
    dotfiles_repo: "https://github.com/jdvober/dotfiles.git"
    dotfiles_path: /home/{{ username}}/github.com/jdvober/dotfiles/
    global_fonts_path: /usr/local/share/fonts/ # Destination for global font usage.
    required_folders:
      - "{{ global_fonts_path }}"
      - "{{ dotfiles_path }}"
    dotfiles_folders:
        - beets
        - eza
        - fish
        - neofetch
        - nvim
        - vim
        - wezterm
        - yazi
        - zsh
    maintenance_errors: []
  tasks:
    ###########################################################################
    # --- Package Installation Setup ---
    ###########################################################################
        - name: Enable Multilib repository
          replace:
            path: /etc/pacman.conf
            regexp: '^#\[multilib\]\n#Include'
            replace: "[multilib]\nInclude"
          become: yes
          register: pacman_config
    
        - name: Update pacman cache if config changed
          when: pacman_config.changed
          command: pacman -Sy
          become: yes
    
        ###########################################################################
        # --- FLATPAK SETUP ---
        ###########################################################################
        - name: Ensure flatpak is installed
          pacman:
            name: flatpak
            state: latest
          become: yes
    
        - name: Add Flathub repository
          community.general.flatpak_remote:
            name: flathub
            state: present
            flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
          become: yes # Use 'yes' for system-wide or 'no' for user-level

        ###########################################################################
        # --- AUR SUPPORT SETUP ---
        ###########################################################################
        - name: Create AUR build user
          user:
            name: aur_builder
            group: wheel
            create_home: yes
    
        - name: Allow aur_builder to use pacman without password
          lineinfile:
            path: /etc/sudoers.d/11-install-aur-builder
            line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
            create: yes
            mode: '0440'
    
        ###########################################################################
        # --- BTRFS & REFIND SNAPSHOTS ---
        ###########################################################################
        - name: Install Snapper, Snap-Pac, and rEFInd-Btrfs
          pacman:
            name: 
              - snapper
              - snap-pac
            state: latest
    
        - name: Install refind-btrfs from AUR
          kewlfft.aur.aur:
            name: refind-btrfs
            use: makepkg
            state: latest
          become: yes
          become_user: aur_builder
    
        - name: Check if snapper config exists
          stat:
            path: /etc/snapper/configs/root
          register: snapper_config
    
        - name: Initialize snapper config for root
          when: not snapper_config.stat.exists
          command: snapper -c root create-config /
    
        - name: Enable refind-btrfs service
          systemd:
            name: refind-btrfs.service
            enabled: yes
            state: started
    
      ###########################################################################
      # --- SNAPPER CLEANUP & RETENTION ---
      ###########################################################################
        - name: Configure Snapper retention policy for root
          lineinfile:
            path: /etc/snapper/configs/root
            regexp: "^{{ item.key }}="
            line: '{{ item.key }}="{{ item.value }}"'
          loop:
            - { key: 'TIMELINE_CLEANUP', value: 'yes' }
            - { key: 'TIMELINE_LIMIT_HOURLY', value: '5' }
            - { key: 'TIMELINE_LIMIT_DAILY', value: '7' }
            - { key: 'TIMELINE_LIMIT_WEEKLY', value: '0' }
            - { key: 'TIMELINE_LIMIT_MONTHLY', value: '0' }
            - { key: 'TIMELINE_LIMIT_YEARLY', value: '0' }
            - { key: 'NUMBER_LIMIT', value: '10' } # Limits snapshots triggered by snap-pac
            - { key: 'NUMBER_LIMIT_IMPORTANT', value: '5' }
    
        - name: Enable and start Snapper cleanup timers
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop:
            - snapper-cleanup.timer
            - snapper-timeline.timer
    ###########################################################################
    # --- Syncing Packages ---
    ###########################################################################
    
        - name: Generating package lists
          set_fact:
            cross_platform_present_packages: "{{ (cross_platform_packages) | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}"
            cross_platform_latest_packages: "{{ (cross_platform_packages) | selectattr('state', 'equalto', 'latest') | map(attribute='name') | list }}"
            cross_platform_absent_packages: "{{ (cross_platform_packages) | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}"

            pacman_present_packages: "{{ (pacman_packages) | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}"
            pacman_latest_packages: "{{ (pacman_packages) | selectattr('state', 'equalto', 'latest') | map(attribute='name') | list }}"
            pacman_absent_packages: "{{ (pacman_packages) | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}"

            aur_present_packages: "{{ (aur_packages) | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}"
            aur_latest_packages: "{{ (aur_packages) | selectattr('state', 'equalto', 'latest') | map(attribute='name') | list }}"
            aur_absent_packages: "{{ (aur_packages) | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}"

            debian_present_packages: "{{ (debian_packages) | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}"
            debian_latest_packages: "{{ (debian_packages) | selectattr('state', 'equalto', 'latest') | map(attribute='name') | list }}"
            debian_absent_packages: "{{ (debian_packages) | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}"

            flatpak_present_packages: "{{ (flatpaks) | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}"
            flatpak_absent_packages: "{{ (flatpaks) | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}"
        ###########################################################################
        # --- Sync Cross Platform Packages ---
        ###########################################################################
        - name: Install Present Cross-Platform packages
          block:
            - name: Install Present Cross-Platform packages
              package:
                name: "{{ cross_platform_packages | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to pacman
                state: present
              become: yes
          rescue:
            - name: Record Cross-Platform Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Cross Platform: Bulk update of packages marked as present failed (check logs for conflicts)'] }}"

        - name: Install Latest Cross-Platform packages
          block: 
            - name: Install Latest Cross-Platform packages
              package:
                name: "{{ cross_platform_packages | selectattr('state', 'equalto', 'latest') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to pacman
                state: latest
              become: yes
          rescue:
            - name: Record Cross-Platform Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Cross Platform: Bulk update of packages marked as latest failed (check logs for conflicts)'] }}"

        - name: Remove Cross-Platform packages
          block: 
            - name: Remove Cross-Platform packages
              package:
                name: "{{ cross_platform_packages | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to pacman
                state: absent
              become: yes
          rescue:
            - name: Record Cross Platform Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Cross Platform: Bulk removeal failed (check logs for conflicts)'] }}"
    
        ###########################################################################
        # --- Sync Arch-only packages ---
        ###########################################################################
        - name: Install Present Arch-specific packages with Pacman (non-AUR)
          block: 
            - name: Install Present Arch-specific packages with Pacman (non-AUR)
              when: 
                - ansible_facts['os_family'] == "Archlinux"
                - pacman_present_packages | length > 0
              pacman:
                name: "{{ pacman_packages | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to pacman
                state: present
              become: yes
          rescue:
            - name: Record Arch Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Pacman: Bulk update of packages marked as present failed (check logs for conflicts)'] }}"
            

        - name: Install Latest Arch-specific packages with Pacman (non-AUR)
          block: 
            - name: Install Latest Arch-specific packages with Pacman (non-AUR)
              when: 
                - ansible_facts['os_family'] == "Archlinux"
                - pacman_latest_packages | length > 0
              pacman:
                name: "{{ pacman_packages | selectattr('state', 'equalto', 'latest') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to pacman
                state: latest
              become: yes
          rescue:
            - name: Record Arch Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Pacman: Bulk update of packages marked as latest failed (check logs for conflicts)'] }}"

        - name: Uninstall Arch-specific packages with Pacman (non-AUR)
          block: 
            - name: Uninstall Arch-specific packages with Pacman (non-AUR)
              when: 
                - ansible_facts['os_family'] == "Archlinux"
                - pacman_absent_packages | length > 0
              pacman:
                name: "{{ pacman_packages | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}"
                state: absent
              become: yes
          rescue:
            - name: Record Arch Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Pacman: Bulk removeal failed (check logs for conflicts)'] }}"

        ###########################################################################
        # --- Sync AUR packages ---
        ###########################################################################

        - name: Install Present AUR Packages
          block: 
            - name: Install Present AUR Packages
              when: 
                - ansible_facts['os_family'] == "Archlinux"
                - aur_present_packages | length > 0
              kewlfft.aur.aur:
                name: "{{ aur_packages | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to yay
                state: present
              become: yes
              become_user: aur_builder
          rescue:
            - name: Record AUR Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['AUR: Bulk update of packages marked as present failed (check logs for conflicts)'] }}"

        - name: Install Latest AUR Packages
          block: 
            - name: Install Latest AUR Packages
              when: 
                - ansible_facts['os_family'] == "Archlinux"
                - aur_latest_packages | length > 0
              kewlfft.aur.aur:
                name: "{{ aur_packages | selectattr('state', 'equalto', 'latest') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to yay
                state: latest
              become: yes
              become_user: aur_builder
          rescue:
            - name: Record AUR Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['AUR: Bulk update of packages marked as latest failed (check logs for conflicts)'] }}"

        - name: Uninstall AUR Packages
          block: 
            - name: Uninstall AUR Packages
              when: 
                - ansible_facts['os_family'] == "Archlinux"
                - aur_absent_packages | length > 0
              kewlfft.aur.aur:
                name: "{{ aur_packages | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}"
                state: absent
              become: yes
              become_user: aur_builder
          rescue:
            - name: Record AUR Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['AUR: Bulk removeal failed (check logs for conflicts)'] }}"
    
        ###########################################################################
        # --- Sync Debian packages ---
        ###########################################################################
        - name: Install Present Debian-specific packages with apt
          block: 
            - name: Install Present Debian-specific packages with apt
              when: 
                - ansible_facts['os_family'] == "Debian"
                - debian_present_packages | length > 0
              apt:
                name: "{{ debian_packages | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to apt
                state: present
              become: yes
          rescue:
            - name: Record Debian Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Debian: Bulk update of packages marked as present failed (check logs for conflicts)'] }}"
            

        - name: Install Latest Debian-specific packages with apt
          block: 
            - name: Install Latest Debian-specific packages with apt
              when: 
                - ansible_facts['os_family'] == "Debian"
                - apt_latest_packages | length > 0
              apt:
                name: "{{ apt_packages | selectattr('state', 'equalto', 'latest') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to apt
                state: latest
              become: yes
          rescue:
            - name: Record Debian Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['apt: Bulk update of packages marked as latest failed (check logs for conflicts)'] }}"

        - name: Uninstall Debian-specific packages with apt
          block: 
            - name: Uninstall Debian-specific packages with apt
              when: 
                - ansible_facts['os_family'] == "Debian"
                - apt_absent_packages | length > 0
              apt:
                name: "{{ apt_packages | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}"
                state: absent
              become: yes
          rescue:
            - name: Record Debian Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['apt: Bulk removeal failed (check logs for conflicts)'] }}"

        ###########################################################################
        # --- Sync Flatpaks ---
        ###########################################################################
        - name: Install Flatpaks
          block: 
            - name: Install Flatpaks
              when: 
                - flatpak_present_packages | length > 0
              community.general.flatpak:
                name: "{{ flatpaks | selectattr('state', 'equalto', 'present') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to flatpak
                state: present
              become: yes # Optional: Install to user space instead of system-wide
          rescue:
            - name: Record Flatpak Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Flatpak: Bulk update of flatpaks failed (check logs for conflicts)'] }}"

        - name: Remove Flatpaks
          block: 
            - name: Remove Flatpaks
              when: 
                - flatpak_absent_packages | length > 0
              community.general.flatpak:
                name: "{{ flatpaks | selectattr('state', 'equalto', 'absent') | map(attribute='name') | list }}" # Extract the 'name' of each package that should be installed to pass to flatpak
                state: absent
              become: yes # Optional: Install to user space instead of system-wide
          rescue:
            - name: Record Flatpak Failure
              set_fact:
                maintenance_errors: "{{ maintenance_errors + ['Flatpak: Bulk removeal failed (check logs for conflicts)'] }}"

        - name: Uninstall unused Flatpak runtimes
          command: flatpak uninstall --unused -y
          changed_when: false
    
    
    ###########################################################################
    # --- DOTFILES ---
    ###########################################################################
        ###########################################################################
        # --- Cloning Dotfiles Repo ---
        ###########################################################################

        - name: Check if dotfiles directory exists
          stat:
            path: "{{ dotfiles_path }}"
          register: repo_status
        
        - name: Clone dotfiles repository
          when: not repo_status.stat.exists
          become: no
          git:
            repo: "{{ dotfiles_repo }}"
            dest: "{{ dotfiles_path }}"
            update: yes
    
        ###########################################################################
        # --- Symlinking Dotfiles ---
        ###########################################################################
        - name: Check existence of all dotfiles_folders listed above
          stat:
            path: "{{ folder_path }}"
          loop: "{{ dotfiles_folders }}"
          loop_control:
            loop_var: folder_path
          register: dotfiles_folder_stats

        - name: Symlink configuration directories to ~/.config from dotfiles
          when: not folder_stat.stat.exists
          become: no
          file:
            src: "{{ dotfiles_path }}/.config/{{ folder_stat.folder_path | basename }}"
            dest: "~/.config/{{ folder_stat.folder_path | basename }}"
            state: link
          loop: "{{ dotfiles_folder_stats.results }}"
          loop_control:
            loop_var: folder_stat
            label: "{{ folder_stat.folder_path }}" # Cleans up terminal output
    
        ###########################################################################
        #  Copy Fonts
        ###########################################################################
        - name: Check if fonts have been copied
          stat:
            path: "{{ global_fonts_path }}/fira"
          register: fira_status

        - name: Copy fonts
          when: not fira_status.stat.exists
          become: yes 
          copy:
            src: "{{ dotfiles_path}}/fonts/"
            dest: "{{ global_fonts_path }}"
            mode: '0755'

  ###########################################################################
  #  Updating and Upgrading
  ###########################################################################
        ###########################################################################
        # --- ARCH LINUX UPDATES ---
        ###########################################################################
        - name: Update Arch system packages (pacman)
          community.general.pacman:
            update_cache: yes
            upgrade: yes
          become: yes
          when: ansible_facts['os_family'] == "Archlinux"

        - name: Update AUR packages (using yay)
          command: yay
          when: ansible_facts['os_family'] == "Archlinux"

        ###########################################################################
        # --- DEBIAN SERVER UPDATES ---
        ###########################################################################
        - name: Update Debian system packages (apt)
          apt:
            update_cache: yes
            upgrade: dist
          become: yes
          when: ansible_facts['os_family'] == "Debian"

        ###########################################################################
        # --- UNIVERSAL FLATPAK UPDATE ---
        ###########################################################################
        - name: Update all installed Flatpaks
          command: flatpak update --noninteractive
          when: ansible_facts['system'] == "Linux"
          register: flatpak_result
          changed_when: "'Nothing to do' not in flatpak_result.stdout"

        - name: Remove all Flatpaks that are no longer required
          command: flatpak uninstall --unused -y
          when: ansible_facts['system'] == "Linux"
          changed_when: false

        ###########################################################################
        # --- WINDOWS 11 WORK UPDATES ---
        ###########################################################################
        - name: Install all Windows updates
          ansible.windows.win_updates:
            category_names: '*'
            reboot: yes
          when: ansible_facts['os_family'] == "Windows"
        
        ###########################################################################
        #  Cleanup
        ###########################################################################
        - name: System Cleanup and Maintenance
          ignore_errors: true # Continue even if a cleanup task fails
          block:
            ###########################################################################
            # ARCH CLEANUP
            ###########################################################################
            - name: Remove orphaned packages (Arch)
              command: pacman -Rs $(pacman -Qdtq)
              register: orphan_out
              failed_when: false # Don't fail if no orphans are found
              changed_when: orphan_out.rc == 0
              become: yes
              when: ansible_facts['distribution'] == "Archlinux"

            - name: Clean Pacman cache (keep latest 3)
              command: paccache -r
              become: yes
              when: ansible_facts['distribution'] == "Archlinux"

            ###########################################################################
            # DEBIAN CLEANUP
            ###########################################################################
            - name: Remove unused dependencies (Debian)
              apt:
                autoremove: yes
                purge: yes
              become: yes
              when: ansible_facts['os_family'] == "Debian"

            ###########################################################################
            # UNIVERSAL FLATPAK CLEANUP
            ###########################################################################
            - name: Uninstall unused Flatpak runtimes
              command: flatpak uninstall --unused -y
              register: fp_cleanup
              changed_when: "'Nothing to do' not in fp_cleanup.stdout"
              when: ansible_facts['system'] == "Linux"
          
###########################################################################
# Summary
###########################################################################
  post_tasks:
    - name: Final Maintenance Summary
      pause:
        seconds: 1
        prompt: |
          ==========================================
          SYSTEM MAINTENANCE REPORT
          ==========================================
          {% if maintenance_errors | length == 0 %}
          STATUS: SUCCESS
          All packages updated perfectly on {{ ansible_facts['hostname'] }}.
          {% else %}
          STATUS: COMPLETED WITH ISSUES
          The following issues were detected:
          {% for error in maintenance_errors %}
          - {{ error }}
          {% endfor %}
          {% endif %}
          ==========================================
